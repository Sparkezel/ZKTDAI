name: rust

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so CI lints/builds with a known compiler (bump together with the
  # dev machine's stable).
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p zktdai
      - name: Contract test (Linux library outside the engine)
        run: cargo run --locked --manifest-path tools/dll-smoke/Cargo.toml -- target/release/libzktdai.so
      - name: Package layout check
        run: |
          tools/package.sh -o /tmp/dist
          test -f /tmp/dist/AI/Skirmish/ZKTDAI/*/libSkirmishAI.so
          test -f /tmp/dist/AI/Skirmish/ZKTDAI/*/AIInfo.lua
          test -f /tmp/dist/AI/Skirmish/ZKTDAI/*/AIOptions.lua

  package:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: tools/setup-toolchain.sh
      - id: version
        name: Version (a tag must match the crate's)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zktdai/Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$version" ] || {
              echo "::error::tag $GITHUB_REF_NAME does not match crates/zktdai/Cargo.toml version $version"
              exit 1
            }
            artifact="ZKTDAI-$version"
          else
            artifact="ZKTDAI-$version-g${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - run: tools/package.sh --cross -v "${{ steps.version.outputs.version }}" -o dist
      - name: Contract test (Linux library outside the engine)
        run: cargo run --locked --manifest-path tools/dll-smoke/Cargo.toml -- dist/AI/Skirmish/ZKTDAI/*/libSkirmishAI.so
      # The artifact unpacks into a Spring data directory: AI/Skirmish/ZKTDAI/<version>/
      # with libSkirmishAI.so (Linux) and SkirmishAI.dll (Windows).
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist
      - name: Archive
        run: |
          (cd dist && zip -qr "../ZKTDAI-$VERSION.zip" AI)
          sha256sum "ZKTDAI-$VERSION.zip" dist/AI/Skirmish/ZKTDAI/"$VERSION"/{libSkirmishAI.so,SkirmishAI.dll} > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "ZKTDAI $VERSION" \
            --notes "Unzip into the engine's data directory (the one holding \`games/\` and \`maps/\`, e.g. \`~/.spring\`): it holds \`AI/Skirmish/ZKTDAI/$VERSION/\` with the Linux (\`libSkirmishAI.so\`) and Windows (\`SkirmishAI.dll\`) libraries; lobbies then offer ZKTDAI $VERSION." \
            "ZKTDAI-$VERSION.zip" SHA256SUMS
