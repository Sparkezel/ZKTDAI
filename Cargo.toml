[workspace]
resolver = "3"
members = ["crates/checkpoint", "crates/checkpoint-derive", "crates/springai-sys", "crates/springai", "crates/zktdai"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/Sparkezel/ZKTDAI"
rust-version = "1.88"

[workspace.dependencies]
springai-sys = { path = "crates/springai-sys" }
springai = { path = "crates/springai" }
checkpoint = { path = "crates/checkpoint" }

[profile.release]
# The engine must never be taken down by an AI panic: unwinds are caught at
# the FFI boundary (see springai::export), so `panic = "abort"` is not an option.
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
# Keep symbol names for the engine crash handler's backtraces.
strip = "debuginfo"

[profile.dev]
# Ordering and ownership loops are hot; unoptimised builds are too slow to
# play a real game with.
opt-level = 1
